        const allDefinitions = buildDefinitionMap();

        // =========================================================================
        // MATH & GEOMETRY HELPERS
        // =========================================================================

        function polarToCartesian(centerX, centerY, radius, angleInDegrees) {
          const angleInRadians = (angleInDegrees - 90) * (Math.PI / 180.0);
          return {
            x: centerX + (radius * Math.cos(angleInRadians)),
            y: centerY + (radius * Math.sin(angleInRadians)),
          };
        }

        function describeArc(x, y, innerRadius, outerRadius, startAngle, endAngle) {
          const angleDiff = endAngle - startAngle;
          if (angleDiff >= 360) {
            const mid = startAngle + 180;
            return `${describeArc(x, y, innerRadius, outerRadius, startAngle, mid)} ${describeArc(x, y, innerRadius, outerRadius, mid, endAngle)}`;
          }

          const startInner = polarToCartesian(x, y, innerRadius, endAngle);
          const endInner = polarToCartesian(x, y, innerRadius, startAngle);
          const startOuter = polarToCartesian(x, y, outerRadius, endAngle);
          const endOuter = polarToCartesian(x, y, outerRadius, startAngle);
          const largeArcFlag = angleDiff <= 180 ? '0' : '1';

          return [
            'M', startOuter.x, startOuter.y,
            'A', outerRadius, outerRadius, 0, largeArcFlag, 0, endOuter.x, endOuter.y,
            'L', endInner.x, endInner.y,
            'A', innerRadius, innerRadius, 0, largeArcFlag, 1, startInner.x, startInner.y,
            'Z'
          ].join(' ');
        }

        function describeCurvedTextArc(centerX, centerY, radius, startAngle, endAngle) {
          const midAngle = startAngle + (endAngle - startAngle) / 2;
          const isBottom = midAngle > 90 && midAngle < 270;

          if (isBottom) {
            const start = polarToCartesian(centerX, centerY, radius, endAngle);
            const end = polarToCartesian(centerX, centerY, radius, startAngle);
            const largeArc = (endAngle - startAngle) <= 180 ? 0 : 1;
            return `M ${start.x} ${start.y} A ${radius} ${radius} 0 ${largeArc} 0 ${end.x} ${end.y}`;
          } else {
            const start = polarToCartesian(centerX, centerY, radius, startAngle);
            const end = polarToCartesian(centerX, centerY, radius, endAngle);
            const largeArc = (endAngle - startAngle) <= 180 ? 0 : 1;
            return `M ${start.x} ${start.y} A ${radius} ${radius} 0 ${largeArc} 1 ${end.x} ${end.y}`;
          }
        }

        function getSegmentThemeColor(path, levelIndex, isValues) {
          if (!path || path.length === 0) return '#1d4ed8';
          const rootName = path[0];
          const framework = isValues ? defaultValuesFramework : defaultCompetencyFramework;
          const rootNode = framework.find(n => n.name === rootName);
          if (!rootNode) return '#1d4ed8';
          if (levelIndex === 0) return rootNode.palette.ring1;
          if (levelIndex === 1) return rootNode.palette.ring2;
          return rootNode.palette.ring3;

Target Focus Areas:
• Competencies & Observable Skills: ${compStr}
• Core Values & Workplace Behaviors: ${valStr}

1. 70% Experiential (On-the-Job): 3 concrete, high-impact stretch assignments or workplace experiments I can start this week.
2. 20% Social (Exposure & Mentoring): 2 structured conversations, mentorship exercises, or shadowing opportunities.
3. 10% Formal (Education): 2 curated book chapters, foundational models, or skill frameworks to study.

Also include 3 reflective self-coaching questions for my 30-day review.`;

        function WheelContainer({

          valuesPaths,

          isMultiSelect

          const rafRef = useRef(null);

          const lastClickTimeRef = useRef(0);
          const pendingSliceRef = useRef(null);
          const svgRef = useRef(null);

          const center = viewBoxSize / 2;
          const centerRadius = 82;

          // IN FOCUSED VIEW: Competencies shows all 3 rings; Values shows 2 rings.
          const rRing1_Full = 295; // Expanded center ring! (width = 213px)
          const rRing2_Full = 465; // Outer ring (width = 170px)

          const rRing2_Focus = activeMode === 'values' ? 465 : 340;

            const result = [];

            if (activeMode === 'competencies') {
              const sectorAngle = 360 / defaultCompetencyFramework.length;

              defaultCompetencyFramework.forEach((lvl, lvlIdx) => {
                const lvlStart = lvlIdx * sectorAngle;
                const lvlEnd = lvlStart + sectorAngle;
                const lvlPath = [lvl.name];

                // RING 1: Core Leadership Level
                result.push({
                  id: lvlPath.join('---'),
                  name: lvl.name,
                  level: 0,
                  path: lvlPath,
                  startAngle: lvlStart,
                  endAngle: lvlEnd,
                  innerRadius: centerRadius,
                  outerRadius: isZoomedOut ? rRing1_Full : rRing1_Focus,
                  color: lvl.palette.ring1
                });

                const catSpan = sectorAngle / lvl.categories.length;
                lvl.categories.forEach((cat, catIdx) => {
                  const catStart = lvlStart + (catIdx * catSpan);
                  const catEnd = catStart + catSpan;
                  const catPath = [...lvlPath, cat.name];

                  // RING 2: Competency Category
                  result.push({
                    id: catPath.join('---'),
                    name: cat.name,
                    level: 1,
                    path: catPath,
                    startAngle: catStart,
                    endAngle: catEnd,
                    innerRadius: isZoomedOut ? rRing1_Full : rRing1_Focus,
                    outerRadius: isZoomedOut ? rRing2_Full : rRing2_Focus,
                    color: lvl.palette.ring2
                  });

                  // RING 3: Sub-competencies (ONLY IN FOCUSED VIEW!)
                  if (!isZoomedOut) {
                    const subSpan = catSpan / cat.children.length;
                    cat.children.forEach((sub, subIdx) => {
                      const subStart = catStart + (subIdx * subSpan);
                      const subEnd = subStart + subSpan;
                      const subPath = [...catPath, sub.name];

                      result.push({
                        id: subPath.join('---'),
                        name: sub.name,
                        level: 2,
                        path: subPath,
                        startAngle: subStart,
                        endAngle: subEnd,
                        innerRadius: rRing2_Focus,
                        outerRadius: rRing3_Focus,
                        color: lvl.palette.ring3
                      });
                    });
                  }
                });
              });
            } else {
              // VALUES: 2 Rings for both Full View and Focused View
              const sectorAngle = 360 / defaultValuesFramework.length;
              defaultValuesFramework.forEach((val, valIdx) => {
                const valStart = valIdx * sectorAngle;
                const valEnd = valStart + sectorAngle;
                const valPath = [val.name];

                // RING 1: Core Value
                result.push({
                  id: valPath.join('---'),
                  name: val.name,
                  level: 0,
                  path: valPath,
                  startAngle: valStart,
                  endAngle: valEnd,
                  innerRadius: centerRadius,
                  outerRadius: isZoomedOut ? rRing1_Full : rRing1_Focus,
                  color: val.palette.ring1
                });

                const behSpan = sectorAngle / val.children.length;
                val.children.forEach((beh, behIdx) => {
                  const behStart = valStart + (behIdx * behSpan);
                  const behEnd = behStart + behSpan;
                  const behPath = [...valPath, beh.name];

                  // RING 2: Behavior
                  result.push({
                    id: behPath.join('---'),
                    name: beh.name,
                    level: 1,
                    path: behPath,
                    startAngle: behStart,
                    endAngle: behEnd,
                    innerRadius: isZoomedOut ? rRing1_Full : rRing1_Focus,
                    outerRadius: isZoomedOut ? rRing2_Full : rRing2_Focus,
                    color: val.palette.ring2
                  });
                });
              });
            }

            return result;
          }, [activeMode, isZoomedOut]);

          // Snapping logic
          const focusOnPath = (path) => {
            if (!path || path.length === 0) return;
            const targetName = path[path.length - 1];
            const activeSlice = baseSlices.find(s => s.name === targetName);
            if (!activeSlice) return;

            const midAngle = activeSlice.startAngle + (activeSlice.endAngle - activeSlice.startAngle) / 2;
            let targetRotation = 90 - midAngle;
            let delta = targetRotation - rotation;
            delta = ((delta + 180) % 360 + 360) % 360 - 180;

            setIsManual(false);
            setRotation(rotation + delta);
          };

          const handleSliceClick = (slice) => {
            const isValues = activeMode === 'values';
            const selectedPaths = isValues ? valuesPaths : competencyPaths;
            const setSelectedPaths = isValues ? setValuesPaths : setCompetencyPaths;

            const sliceKey = slice.path.join('---');
            const existingIdx = selectedPaths.findIndex(p => p.join('---') === sliceKey);
            let updated = [...selectedPaths];

            if (isMultiSelect) {
              if (existingIdx !== -1) {
                updated = updated.filter((_, i) => i !== existingIdx);
              } else {
                const filtered = updated.filter(p => !p.join('---').startsWith(sliceKey) && !sliceKey.startsWith(p.join('---')));
                updated = [...filtered, slice.path];
              }
            } else {
              updated = existingIdx !== -1 ? [] : [slice.path];
            }

            setSelectedPaths(updated);

            if (updated.length > 0) {
              // Automatically switch to focused view on sector selection!
              if (isZoomedOut) setIsZoomedOut(false);
              setTimeout(() => focusOnPath(slice.path), 40);
            }
          };

          const selectSlice = (slice) => {
            if (!slice) return;
            const now = performance.now();
            if (now - lastClickTimeRef.current < 200) return;
            lastClickTimeRef.current = now;
            handleSliceClick(slice);
          };

          const handlePointerDown = (e) => {
            clickStartRef.current = { x: e.clientX, y: e.clientY };
            if (e.button !== 0 && e.type !== 'touchstart' && e.pointerType !== 'touch') return;

            if (rafRef.current) cancelAnimationFrame(rafRef.current);
            velocityRef.current = 0;

            const rect = svgRef.current.getBoundingClientRect();
            const centerX = rect.left + (rect.width / 2);
            const centerY = rect.top + (rect.height / 2);
            const atan = Math.atan2(e.clientY - centerY, e.clientX - centerX) * 180 / Math.PI;

            dragRef.current = { isDown: true, hasMoved: false, lastAtan: atan };
            lastAngleRef.current = atan;
            lastTimeRef.current = performance.now();
          };

          const handlePointerMove = (e) => {
            if (!dragRef.current.isDown) return;
            const dist = Math.hypot(e.clientX - clickStartRef.current.x, e.clientY - clickStartRef.current.y);
            if (dist > 6 && !dragRef.current.hasMoved) {
              dragRef.current.hasMoved = true;
              setIsManual(true);
              if (svgRef.current && svgRef.current.setPointerCapture && e.pointerId) {
                try { svgRef.current.setPointerCapture(e.pointerId); } catch(err) {}
              }
            }

            if (!dragRef.current.hasMoved) return;
            const rect = svgRef.current.getBoundingClientRect();
            const centerX = rect.left + (rect.width / 2);
            const centerY = rect.top + (rect.height / 2);
            let currentAtan = Math.atan2(e.clientY - centerY, e.clientX - centerX) * 180 / Math.PI;
            let stepDelta = currentAtan - dragRef.current.lastAtan;

            if (stepDelta > 180) stepDelta -= 360;
            if (stepDelta < -180) stepDelta += 360;

            dragRef.current.lastAtan = currentAtan;
            const now = performance.now();
            const dt = Math.max(now - lastTimeRef.current, 1);
            const instantVel = stepDelta / dt;
            velocityRef.current = velocityRef.current * 0.3 + instantVel * 0.7;
            lastAngleRef.current = currentAtan;
            lastTimeRef.current = now;

            setRotation(prev => prev + stepDelta);
          };

          const handlePointerUp = (e) => {
            if (!dragRef.current.isDown) return;
            const hadMoved = dragRef.current.hasMoved;
            dragRef.current.isDown = false;

            if (e && svgRef.current && svgRef.current.releasePointerCapture && e.pointerId) {
              try { svgRef.current.releasePointerCapture(e.pointerId); } catch(err) {}
            }

            const dtSinceMove = performance.now() - lastTimeRef.current;
            if (dtSinceMove > 90) velocityRef.current = 0;

            if (hadMoved && Math.abs(velocityRef.current) > 0.04) {
              let currentVel = velocityRef.current * 16;
              const momentumLoop = () => {
                if (Math.abs(currentVel) < 0.04) return;
                setRotation(prev => prev + currentVel);
                currentVel *= 0.95;
                rafRef.current = requestAnimationFrame(momentumLoop);
              };
              rafRef.current = requestAnimationFrame(momentumLoop);
            } else if (!hadMoved && pendingSliceRef.current) {
              selectSlice(pendingSliceRef.current);
            }
            pendingSliceRef.current = null;
          };

          const currentSelected = activeMode === 'values' ? valuesPaths : competencyPaths;

          const handleFullView = () => {
            setIsZoomedOut(true);
            setRotation(0);
          };

          const handleFocusedView = () => {
            setIsZoomedOut(false);
            if (currentSelected.length > 0) {
              focusOnPath(currentSelected[currentSelected.length - 1]);
            }
          };

          return (
            <div className="relative w-full h-full min-h-[640px] max-h-[85vh] bg-white rounded-3xl border border-slate-200 shadow-sm flex items-center overflow-hidden p-0">
              
              {/* OVERLAY: Upper-Right (Mode Toggle) */}
              <div className="absolute top-4 right-4 z-20">
                <div className="inline-flex rounded-xl p-1 bg-white/95 border border-slate-200 shadow-md backdrop-blur-md">
                  <button
                    onClick={() => setActiveMode('competencies')}
                    className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${activeMode === 'competencies' ? 'bg-rose-700 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                  >
                    <Award size={14} /> Competencies
                  </button>
                  <button
                    onClick={() => setActiveMode('values')}
                    className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${activeMode === 'values' ? 'bg-rose-700 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                  >
                    <Heart size={14} /> Values
                  </button>
                </div>
              </div>

              {/* OVERLAY: Lower-Right (Full View & Focused View Only) */}
              <div className="absolute bottom-4 right-4 z-20 flex items-center gap-2">
                <div className="inline-flex rounded-xl p-1 bg-white/95 border border-slate-200 shadow-md backdrop-blur-md">
                  <button
                    onClick={handleFullView}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${isZoomedOut ? 'bg-charcoal text-white shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                    title="Full View (Resets Rotation)"
                  >
                    Full View
                  </button>
                  <button
                    onClick={handleFocusedView}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${!isZoomedOut ? 'bg-charcoal text-white shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                    title="Focused View (Snaps to Selection)"
                  >
                    Focused View
                  </button>
                </div>
              </div>

              {/* THE SVG WHEEL:
                  - In Full View: centered, fitting cleanly inside the container.
                  - In Focused View: translated significantly to the left (center near left edge, showing ~52% of wheel),
                    and scaled to fill vertical space as illustrated in user screenshot!
              */}
              <svg
                ref={svgRef}
                viewBox={`0 0 ${viewBoxSize} ${viewBoxSize}`}
                className={`drop-shadow-xl transition-all duration-700 ease-in-out select-none ${
                  isZoomedOut 
                    ? 'relative mx-auto w-[92%] max-w-[600px] max-h-[90%]' 
                    : 'absolute left-0 top-1/2 -translate-y-1/2 -translate-x-[48%] h-[125%] sm:h-[135%] w-auto max-w-none'
                }`}
                onPointerDown={handlePointerDown}
                onPointerMove={handlePointerMove}
                onPointerUp={handlePointerUp}
                onPointerCancel={handlePointerUp}
                style={{ touchAction: 'none' }}
              >
                <defs>
                  {/* Curved text baseline paths for Ring 1 */}
                  {baseSlices.filter(s => s.level === 0).map(slice => {
                    const textRadius = slice.innerRadius + (slice.outerRadius - slice.innerRadius) / 2;
                    return (
                      <path
                        key={`text-path-${slice.id}`}
                        id={`text-path-${slice.id}`}
                        d={describeCurvedTextArc(center, center, textRadius, slice.startAngle, slice.endAngle)}
                        fill="none"
                      />
                    );
                  })}
                </defs>

                <g style={{
                  transform: `rotate(${rotation}deg)`,
                  transformOrigin: `${center}px ${center}px`,
                  transition: isManual ? 'none' : 'transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1)'
                }}>
                  {/* Wheel Slices */}
                  {baseSlices.map(slice => {
                    const isSelected = currentSelected.some(p => 
                      p.join('---') === slice.path.join('---') || p.join('---').startsWith(slice.path.join('---') + '---')
                    );

                    // Simplified Selection: Clean White Fill with Charcoal Text
                    const fill = isSelected ? "#ffffff" : slice.color;
                    const textFill = isSelected ? "#1f2937" : "#ffffff";
                    const strokeColor = "#ffffff";
                    const strokeWidth = "1.5";

                    const midAngle = slice.startAngle + (slice.endAngle - slice.startAngle) / 2;
                    const textPos = polarToCartesian(
                      center, center, 
                      slice.innerRadius + (slice.outerRadius - slice.innerRadius) / 2, 
                      midAngle
                    );
                    const textRotation = midAngle - 90;

                    // Text display rule:
                    // In Full View: ONLY Core Ring (Ring 1) text is shown! Outer ring text is hidden until focused or selected!
                    const shouldShowLabel = slice.level === 0 || !isZoomedOut || isSelected;

                    // --- NEW: TEXT SPLITTING LOGIC --- //
                    let displayName = slice.name.length > 21 && slice.level === 2 ? slice.name.slice(0, 19) + '…' : slice.name;
                    let lines = [displayName];
                    
                    // Split by explicit <br> tags, or auto-split long text with spaces
                    if (displayName.includes('<br>')) {
                      lines = displayName.split('<br>');
                    } else if (displayName.includes(' ') && displayName.length > 11) {
                      const words = displayName.split(' ');
                      const mid = Math.ceil(words.length / 2);
                      lines = [words.slice(0, mid).join(' '), words.slice(mid).join(' ')];
                    }

                    return (
                      <g
                        key={slice.id}
                        className="cursor-pointer"
                        onPointerDown={() => { pendingSliceRef.current = slice; }}
                        onClick={(e) => {
                          e.stopPropagation();
                          if (dragRef.current && dragRef.current.hasMoved) return;
                          selectSlice(slice);
                        }}
                      >
                        <path
                          d={describeArc(center, center, slice.innerRadius, slice.outerRadius, slice.startAngle, slice.endAngle)}
                          fill={fill}
                          stroke={strokeColor}
                          strokeWidth={strokeWidth}
                          className="transition-colors duration-200 pointer-events-auto"
                        />

                        {/* Core Ring (Ring 1): Curved baseline text anchored to center */}
                        {slice.level === 0 ? (
                          <text
                            fill={textFill}
                            fontSize={isZoomedOut ? "24" : "19"}
                            fontFamily="Tenor Sans, sans-serif"
                            fontWeight="normal"
                            className="pointer-events-none select-none transition-colors"
                          >
                            <textPath
                              href={`#text-path-${slice.id}`}
                              startOffset="50%"
                              textAnchor="middle"
                            >
                              {slice.name}
                            </textPath>
                          </text>
                        ) : (
                          /* Secondary & Tertiary Rings: Shown in Focused View or when selected */
                          shouldShowLabel && (
                            <text
                              x={textPos.x} y={textPos.y}
                              fill={textFill}
                              fontSize={slice.level === 1 ? "12" : "9.5"}
                              fontFamily="Open Sans, sans-serif"
                              fontWeight={isSelected ? "700" : "600"}
                              textAnchor="middle"
                              alignmentBaseline="middle"
                              pointerEvents="none"
                              transform={`rotate(${textRotation}, ${textPos.x}, ${textPos.y})`}
                              className="pointer-events-none select-none drop-shadow-sm transition-colors"
                            >
                              {slice.name.length > 21 && slice.level === 2 ? slice.name.slice(0, 19) + '…' : slice.name}
                            </text>
                          )
                        )}
                      </g>
                    );
                  })}

                  {/* CENTER CIRCLE: Clean icon-only, no hover/zoom scaling */}
                  <g
                    className="cursor-pointer"
                    onClick={(e) => {
                      e.stopPropagation();
                      setActiveMode(prev => prev === 'competencies' ? 'values' : 'competencies');
                    }}
                  >
                    {activeMode === 'competencies' ? (
                      <>
                        <circle
                          cx={center} cy={center} r={centerRadius}
                          fill="#be185d"
                          className="drop-shadow-sm"
                        />
                        <foreignObject x={center - 20} y={center - 20} width="40" height="40" className="pointer-events-none">
                          <div className="w-full h-full flex items-center justify-center text-white">
                            <Award size={32} strokeWidth={2.2} />
                          </div>
                        </foreignObject>
                      </>
                    ) : (
                      <>
                        <circle
                          cx={center} cy={center} r={centerRadius}
                          fill="#ffffff"
                          stroke="#be185d"
                          strokeWidth="3.5"
                          className="drop-shadow-sm"
                        />
                        <foreignObject x={center - 20} y={center - 20} width="40" height="40" className="pointer-events-none">
                          <div className="w-full h-full flex items-center justify-center text-rose-700">
                            <Heart size={32} strokeWidth={2.2} fill="#be185d" />
                          </div>
                        </foreignObject>
                      </>
                    )}
                  </g>
                </g>
              </svg>
            </div>
          );
        }

        // =========================================================================

        function App() {
          const [savedSessions, setSavedSessions] = useState(() => loadSessions());
          const [user, setUser] = useState(() => {
            try {
              const u = localStorage.getItem(STORAGE_KEY_USER);
              return u ? JSON.parse(u) : null;
            } catch {
              return null;
            }
          });

          const [competencyPaths, setCompetencyPaths] = useState([]);
          const [valuesPaths, setValuesPaths] = useState([]);
          const [activeMode, setActiveMode] = useState('competencies');
          const [isMultiSelect, setIsMultiSelect] = useState(true);
          const [currentView, setCurrentView] = useState('auto'); // 'welcome' | 'explorer' | 'learning-path' | 'dashboard' | 'auto'

          const [activeSession, setActiveSession] = useState(null);
          const [isNewPathModalOpen, setIsNewPathModalOpen] = useState(false);

          // Confirmation Modal State
          const [confirmModal, setConfirmModal] = useState({
            isOpen: false,
            title: '',
            message: '',
            confirmText: 'Confirm',
            confirmColor: 'bg-rose-700',
            onConfirm: () => {}
          });

          // Determine initial effective view based on 3-stage user lifecycle
          const effectiveView = useMemo(() => {
            if (currentView !== 'auto') return currentView;
            if (savedSessions.length === 0) return 'welcome';
            if (savedSessions.length === 1) return 'learning-path';
            return 'dashboard';
          }, [currentView, savedSessions.length]);

          const handleContinueAsGuest = () => {
            setCompetencyPaths([]);
            setValuesPaths([]);
            setActiveSession(null);
            setCurrentView('explorer');
          };

          const handleLogin = (userData) => {
            setUser(userData);
            localStorage.setItem(STORAGE_KEY_USER, JSON.stringify(userData));
            setCompetencyPaths([]);
            setValuesPaths([]);
            setCurrentView('explorer');
          };

          const handleEditSession = (session) => {
            setActiveSession(session);
            setCompetencyPaths(session.competencies || []);
            setValuesPaths(session.values || []);
            setCurrentView('explorer');
          };

          const handleRequestDeleteSession = (sessionId) => {
            setConfirmModal({
              isOpen: true,
              title: "Delete Learning Path",
              message: "Are you sure you want to delete this learning path? This action cannot be undone.",
              confirmText: "Delete",
              confirmColor: "bg-red-600",
              onConfirm: () => {
                const updated = savedSessions.filter(s => s.id !== sessionId);
                setSavedSessions(updated);
                saveSessions(updated);
                setConfirmModal(prev => ({ ...prev, isOpen: false }));
              }
            });
          };

          const handleCreateNewPath = () => {
            setCompetencyPaths([]);
            setValuesPaths([]);
            setActiveSession(null);
            setCurrentView('explorer');
          };

          // Save to Account from Modal -> Automatically launch fresh blank wheel!
          const handleSaveToAccountAndStartNew = () => {
            const primaryLevel = competencyPaths.length > 0 ? competencyPaths[0][0] : "Professional";
            const newSession = {
              id: activeSession ? activeSession.id : Date.now().toString(),
              date: new Date().toISOString(),
              title: `${primaryLevel} Development Plan`,
              competencies: competencyPaths,
              values: valuesPaths
            };

            const updated = [newSession, ...savedSessions.filter(s => s.id !== newSession.id)];
            setSavedSessions(updated);
            saveSessions(updated);

            // Automatically open fresh blank wheel!
            setIsNewPathModalOpen(false);
            setCompetencyPaths([]);
            setValuesPaths([]);
            setActiveSession(null);
            setCurrentView('explorer');
          };

          const handleDiscardAndStartNew = () => {
            setIsNewPathModalOpen(false);
            setCompetencyPaths([]);
            setValuesPaths([]);
            setActiveSession(null);
            setCurrentView('explorer');
          };

          const handleRequestClearAll = () => {
            setConfirmModal({
              isOpen: true,
              title: "Clear All Selections",
              message: "Are you sure you want to clear all selected competencies and values?",
              confirmText: "Clear All",
              confirmColor: "bg-rose-700",
              onConfirm: () => {
                setCompetencyPaths([]);
                setValuesPaths([]);
                setConfirmModal(prev => ({ ...prev, isOpen: false }));
              }
            });
          };

          return (
            <div className="min-h-screen flex flex-col bg-white text-charcoal">
              
              {/* GLOBAL HEADER: NO AUTHOR NAME, TOOL TITLE IS "Competency and Values Wheel", ONLY PRIMARY CONTACT ME BUTTON */}
              <header className="w-full bg-white/95 border-b border-slate-200 sticky top-0 z-40 no-print">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
                  
                  {/* Logo & Tool Title */}
                  <div 
                    className="flex items-center gap-2.5 cursor-pointer select-none"
                    onClick={() => setCurrentView('auto')}
                  >
                    <ThreeColorPieIcon size={26} />
                    <h1 className="text-base sm:text-lg font-heading text-charcoal leading-none tracking-tight">
                      Competency and Values Wheel
                    </h1>
                  </div>

                  {/* Right Side: Primary "Contact Me" Button going to www.mslilymckay.com */}
                  <div className="flex items-center gap-3">
                    <a
                      href="https://www.mslilymckay.com"
                      target="_blank"
                      rel="noopener noreferrer"
                      className="py-2 px-5 rounded-xl bg-rose-700 hover:bg-rose-800 text-white font-bold text-xs sm:text-sm shadow-md transition-all hover:scale-105 active:scale-95 flex items-center gap-1.5"
                    >
                      <span>Contact Me</span>
                      <ExternalLink size={14} />
                    </a>
                  </div>

                </div>
              </header>

              {/* MAIN BODY VIEW */}
              <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 flex flex-col">
                
                {/* STAGE 1: WELCOME SCREEN */}
                {effectiveView === 'welcome' && (
                  <WelcomeScreen
                    onContinueAsGuest={handleContinueAsGuest}
                    onLogin={handleLogin}
                  />
                )}

                {/* STAGE 3: MULTI-PATH DASHBOARD */}
                {effectiveView === 'dashboard' && (
                  <MultiPathDashboard
                    savedSessions={savedSessions}
                    onEditSession={handleEditSession}
                    onRequestDeleteSession={handleRequestDeleteSession}
                    onCreateNewPath={handleCreateNewPath}
                  />
                )}

                {/* EXPLORER (WHEEL + DEFINITIONS) */}
                {effectiveView === 'explorer' && (
                  <div className="flex-1 grid grid-cols-1 lg:grid-cols-2 gap-6 items-stretch animate-in fade-in duration-300">
                    <WheelContainer
                      activeMode={activeMode}
                      setActiveMode={setActiveMode}
                      competencyPaths={competencyPaths}
                      setCompetencyPaths={setCompetencyPaths}
                      valuesPaths={valuesPaths}
                      setValuesPaths={setValuesPaths}
                      isMultiSelect={isMultiSelect}
                    />

                    <DefinitionsPanel
                      activeMode={activeMode}
                      setActiveMode={setActiveMode}
                      competencyPaths={competencyPaths}
                      setCompetencyPaths={setCompetencyPaths}
                      valuesPaths={valuesPaths}
                      setValuesPaths={setValuesPaths}
                      isMultiSelect={isMultiSelect}
                      setIsMultiSelect={setIsMultiSelect}
                      onExploreLearningPath={() => setCurrentView('learning-path')}
                      onRequestClearAll={handleRequestClearAll}
                    />
                  </div>
                )}

                {/* STAGE 2 / LEARNING PATH VIEW */}
                {effectiveView === 'learning-path' && (
                  <LearningPathView
                    session={activeSession || savedSessions[0]}
                    competencies={competencyPaths.length > 0 ? competencyPaths : (savedSessions[0]?.competencies || [])}
                    values={valuesPaths.length > 0 ? valuesPaths : (savedSessions[0]?.values || [])}
                    onBackToExplorer={() => setCurrentView('explorer')}
                    onNewLearningPathModal={() => setIsNewPathModalOpen(true)}
                    user={user}
                  />
                )}

              </main>

              {/* FOOTER: DISPLAYED ON ALL "HOMEPAGE" STAGES (1-3), NOT ON WHEEL EXPLORER */}
              {effectiveView !== 'explorer' && <BrandFooter />}

              {/* MODALS */}
              <NewLearningPathModal
                isOpen={isNewPathModalOpen}
                onClose={() => setIsNewPathModalOpen(false)}
                onSaveToAccount={handleSaveToAccountAndStartNew}
                onDiscardAndStartNew={handleDiscardAndStartNew}
              />

              <ConfirmationModal
                isOpen={confirmModal.isOpen}
                title={confirmModal.title}
                message={confirmModal.message}
                confirmText={confirmModal.confirmText}
                confirmColor={confirmModal.confirmColor}
                onConfirm={confirmModal.onConfirm}
                onCancel={() => setConfirmModal(prev => ({ ...prev, isOpen: false }))}
              />

            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
